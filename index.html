<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connelly Family Calendar</title>
  <meta name="description" content="The Connelly family calendar" />

  <!-- Prevent search engine indexing — this is a private family page -->
  <meta name="robots" content="noindex, nofollow" />

  <!-- Favicon emoji -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏡</text></svg>" />

  <!-- Tabler icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />

  <!-- Our styles -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ── Site header ───────────────────────────────────────── -->
  <header id="site-header">
    <div>
      <div id="site-name">Connelly Family Calendar</div>
      <div id="site-sub">connellyfamily.org</div>
    </div>
    <div id="legend" role="list" aria-label="Calendar legend"></div>
  </header>

  <!-- ── Lock screen ──────────────────────────────────────── -->
  <main id="lock-screen" role="main" aria-label="Login">
    <i class="ti ti-lock lock-icon" aria-hidden="true"></i>
    <h1 class="lock-title">Welcome to the Connelly Family Calendar</h1>
    <p class="lock-sub">Enter the family password to view events</p>
    <div class="pw-row">
      <input
        id="pw-input"
        type="password"
        placeholder="Family password"
        autocomplete="current-password"
        aria-label="Family password"
      />
      <button id="pw-btn" type="button">Enter</button>
    </div>
    <p id="pw-error" role="alert">Incorrect password — try again</p>
  </main>

  <!-- ── Calendar (shown after login) ────────────────────── -->
  <section id="cal-wrapper" aria-label="Family calendar">

    <nav class="cal-nav" aria-label="Calendar navigation">
      <div class="nav-btns">
        <button id="btn-prev" class="nav-btn" aria-label="Previous month">← Prev</button>
        <button id="btn-today" class="nav-btn" aria-label="Go to today">Today</button>
        <button id="btn-next" class="nav-btn" aria-label="Next month">Next →</button>
      </div>
      <h2 id="month-label" aria-live="polite">May 2026</h2>
    </nav>

    <div id="loading-spinner" role="status" aria-label="Loading events">
      <div class="spinner-ring"></div>
      Loading calendar events…
    </div>

    <div id="cal-grid" role="grid" aria-label="Calendar grid"></div>

  </section>

  <footer class="site-footer">
    Connelly Family &nbsp;·&nbsp; Private page
  </footer>

  <!-- Config first, then app -->
  <script src="config.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
