<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connelly Family Calendar</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏡</text></svg>" />

  <!-- FullCalendar -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header id="site-header">
    <div>
      <div id="site-name">Connelly Family Calendar</div>
      <div id="site-sub"></div>
    </div>
    <div id="legend"></div>
  </header>

  <main id="lock-screen" style="display:flex">
    <i class="lock-icon">🔒</i>
    <h1 class="lock-title">Welcome to the Connelly Family Calendar</h1>
    <p class="lock-sub">Enter the family password to view events</p>
    <div class="pw-row">
      <input id="pw-input" type="password" placeholder="Family password" autocomplete="current-password" />
      <button id="pw-btn" type="button">Enter</button>
    </div>
    <p id="pw-error">Incorrect password — try again</p>
  </main>

  <section id="cal-wrapper" style="display:none">
    <div id="calendar"></div>
  </section>

  <footer class="site-footer">Connelly Family &nbsp;·&nbsp; Private page &nbsp;·&nbsp; v3.09</footer>

  <!-- Add Event Modal -->
  <div id="modal-overlay" class="modal-overlay" style="display:none">
    <div class="modal-card">
      <div class="modal-header">
        <span>Add Event</span>
        <button id="modal-close" class="modal-close">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-field">
          <label for="ev-title">Event Title</label>
          <input type="text" id="ev-title" placeholder="What's happening?" />
        </div>
        <div class="form-field">
          <label>Calendar</label>
          <div class="cal-pills">
            <div class="cal-pill family active">🟢 Family</div>
            <div class="cal-pill disabled">🔵 Other</div>
            <div class="cal-pill disabled">🟠 Work</div>
          </div>
        </div>
        <div class="toggle-row">
          <span class="toggle-label">All day</span>
          <label class="toggle">
            <input type="checkbox" id="ev-allday" checked />
            <div class="toggle-track"></div>
          </label>
        </div>
        <div class="date-row">
          <div class="form-field">
            <label for="ev-start-date">Start Date</label>
            <input type="date" id="ev-start-date" />
          </div>
          <div class="form-field">
            <label for="ev-end-date">End Date</label>
            <input type="date" id="ev-end-date" />
          </div>
        </div>
        <div id="time-fields" style="display:none">
          <div class="time-row">
            <div class="form-field">
              <label>Start Time</label>
              <div class="time-input-wrap">
                <input type="time" id="ev-start-time" value="09:00" />
                <span class="tz-label" id="tz-label">MDT</span>
              </div>
            </div>
            <div class="time-sep">→</div>
            <div class="form-field">
              <label>End Time</label>
              <div class="time-input-wrap">
                <input type="time" id="ev-end-time" value="10:00" />
                <span class="tz-label" id="tz-label2">MDT</span>
              </div>
            </div>
          </div>
        </div>
        <p id="form-error" class="form-error" style="display:none"></p>
        <p id="form-success" class="form-success" style="display:none">✅ Event added!</p>
      </div>
      <div class="modal-footer">
        <button id="modal-cancel" class="btn-cancel">Cancel</button>
        <button id="modal-save" class="btn-save">Save Event</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
